<!-- =================================================================
     SINGULXR CONTACT FORM

     This is a ready-to-use contact form with Web3Forms integration.

     SETUP INSTRUCTIONS:
     1. Sign up at https://web3forms.com (free)
     2. Get your Access Key from the dashboard
     3. Replace "YOUR_WEB3FORMS_ACCESS_KEY" below with your actual key
     4. Add this entire section to your main HTML before the footer

     ================================================================= -->

<!-- Contact Section -->
<section id="contact" class="sec reveal">
  <div class="wrap">
    <div class="contact-grid">
      <!-- Left side: intro -->
      <div class="contact-intro">
        <span class="eyebrow mono">
          <span class="dot"></span>
          Let's Connect
        </span>
        <h2>Ready to Shape the Future?</h2>
        <p>Whether you're exploring XR possibilities, building AI-driven experiences, or pioneering haptic innovation — let's talk.</p>

        <!-- Contact person card (optional - customize with your details) -->
        <div class="contact-person">
          <div class="cp-avatar">SX</div>
          <div class="cp-body">
            <b>SingulXR Team</b>
            <em>Innovation Partners</em>
          </div>
        </div>

        <!-- Optional WhatsApp button - replace YOUR_PHONE_NUMBER with your actual WhatsApp number including country code -->
        <a href="https://wa.me/YOUR_PHONE_NUMBER" class="btn btn-ghost wa-btn" target="_blank" rel="noopener">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.890-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          WhatsApp
        </a>
      </div>

      <!-- Right side: form -->
      <div class="contact-card">
        <h3>Send us a message</h3>
        <form class="cform" id="contactForm">
          <!-- Web3Forms Configuration -->
          <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
          <input type="hidden" name="subject" value="New Contact Form Submission from SingulXR">
          <input type="hidden" name="from_name" value="SingulXR Contact Form">

          <!-- Honeypot for spam prevention -->
          <input type="checkbox" name="botcheck" style="display: none;">

          <!-- Form Fields -->
          <div class="cf-row">
            <div class="cf-field">
              <span class="mono">Name</span>
              <input type="text" name="name" placeholder="Your name" required>
            </div>
            <div class="cf-field">
              <span class="mono">Email</span>
              <input type="email" name="email" placeholder="your@email.com" required>
            </div>
          </div>

          <div class="cf-field">
            <span class="mono">Message</span>
            <textarea name="message" rows="5" placeholder="Tell us about your project..." required></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span id="btnText">Send Message</span>
            <svg id="btnSpinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
            </svg>
          </button>

          <!-- Status Message -->
          <div id="formMessage" style="margin-top:16px;padding:12px;border-radius:8px;display:none;"></div>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- Contact Form Styles -->
<style>
/* Loading spinner animation */
@keyframes spin {
  to { transform: rotate(360deg); }
}

#btnSpinner {
  animation: spin 1s linear infinite;
}

/* Success and error message styles */
.form-success {
  background: rgba(46, 230, 255, 0.1);
  border: 1px solid rgba(46, 230, 255, 0.3);
  color: var(--accent);
  font-size: 0.95rem;
}

.form-error {
  background: rgba(255, 77, 77, 0.1);
  border: 1px solid rgba(255, 77, 77, 0.3);
  color: #ff6b6b;
  font-size: 0.95rem;
}
</style>

<!-- Contact Form JavaScript -->
<script>
(function() {
  'use strict';

  // Wait for DOM to be fully loaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initContactForm);
  } else {
    initContactForm();
  }

  function initContactForm() {
    const form = document.getElementById('contactForm');
    if (!form) {
      console.warn('Contact form not found');
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const formMessage = document.getElementById('formMessage');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      // Disable button and show loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Sending...';
      btnSpinner.style.display = 'inline-block';
      formMessage.style.display = 'none';
      formMessage.className = '';

      // Get form data
      const formData = new FormData(form);

      // Convert to JSON for better error handling
      const object = {};
      formData.forEach((value, key) => {
        object[key] = value;
      });

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(object)
        });

        const data = await response.json();

        if (data.success) {
          // Success
          formMessage.textContent = '✓ Thank you! Your message has been sent successfully. We\'ll get back to you soon.';
          formMessage.className = 'form-success';
          formMessage.style.display = 'block';
          form.reset();

          // Reset button after 3 seconds
          setTimeout(() => {
            btnText.textContent = 'Send Message';
            btnSpinner.style.display = 'none';
            submitBtn.disabled = false;

            // Hide success message after 10 seconds
            setTimeout(() => {
              formMessage.style.display = 'none';
            }, 10000);
          }, 3000);
        } else {
          throw new Error(data.message || 'Form submission failed');
        }
      } catch (error) {
        // Error
        console.error('Form submission error:', error);
        formMessage.textContent = '✗ Oops! Something went wrong. Please try again or contact us directly.';
        formMessage.className = 'form-error';
        formMessage.style.display = 'block';

        // Reset button
        btnText.textContent = 'Send Message';
        btnSpinner.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  }
})();
</script>
